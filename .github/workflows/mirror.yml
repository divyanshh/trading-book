name: mirror the morning book
on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST, after the 18:00 IST build
    - cron: "10 4 * * 1-5"    # 09:40 IST, after the 09:25 IST morning build
  workflow_dispatch:
    inputs:
      refresh:
        description: re-fetch every day, not only the missing ones
        type: boolean
        default: false
permissions:
  contents: write
concurrency: mirror
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # index.html is the hub, and it is maintained BY HAND -- it carries the
      # interactive benchmark chart. mirror.py rebuilds it from its own
      # template and destroys that chart, which has now happened four times:
      # 74,474 bytes after the crosshair fix, 75,163 after the 1 and 2 October
      # mirrors, back to 74,474 after "Preserve interactive benchmark across
      # mirrors", then 77,656 after a run on 5 October.
      #
      # So the hub is saved, mirror does its real work -- fetching reports and
      # rebuilding stocks/, crypto/ and the redirects -- and the hub is put
      # back. Only its two book counters are re-stamped, from the directories
      # mirror has just refreshed.
      - name: keep the hand-maintained hub
        run: cp index.html /tmp/index.hand.html
      - name: mirror
        run: python3 mirror.py ${{ inputs.refresh && '--refresh' || '' }}
      # The hand-written IPO review is spliced into the day's report, and until
      # now that only happened when somebody ran it locally -- so a published
      # report could go out without the section the checklist insists on.
      #
      # Guarded three ways. A day with no BY_DAY entry is skipped, because the
      # review is written by hand and most days have none. A report under 50 KB
      # is skipped: /reports holds 300-byte redirect stubs since the move to
      # stocks/reports, and one of those was published AS a report on 1 October.
      # And the whole step is best-effort -- a failed splice must not lose the
      # mirror that already succeeded.
      # **An override is the source of its own replacement, and that is a bug.**
      # mirror.py fetches a report only when the file is missing, then copies
      # every override over the published copy unconditionally. The splice
      # below then rebuilds the day's override FROM the published copy. So once
      # an override exists, the service can rebuild that report all it likes and
      # the site keeps serving the version the override was first cut from --
      # through `--refresh` too, which re-fetches and is then overwritten a few
      # lines later inside mirror.py.
      #
      # On 2026-10-16 that swallowed three separate rebuilds, and each one was
      # only noticed because someone looked at the page.
      #
      # refresh_today.py re-fetches the day's report over the published copy,
      # AFTER the mirror has applied the old override and BEFORE the splice
      # cuts a new one. Order is the whole of it: run before the mirror and the
      # override pass simply overwrites the fresh copy again.
      #
      # It refuses any day ipo_review.py cannot rebuild, because the service's
      # copy is the report alone and the published page is report-plus-review.
      - name: re-fetch today so a stale override cannot serve itself
        continue-on-error: true
        run: python3 refresh_today.py

      - name: splice the hand-written IPO review
        continue-on-error: true
        run: |
          DAY=$(TZ=Asia/Kolkata date +%F)
          REPORT="stocks/reports/$DAY.html"
          if ! grep -q "\"$DAY\":" ipo_review.py; then
            echo "no hand-written review for $DAY"; exit 0
          fi
          if [ ! -f "$REPORT" ]; then
            echo "no report at $REPORT yet"; exit 0
          fi
          SIZE=$(wc -c < "$REPORT")
          if [ "$SIZE" -lt 50000 ]; then
            echo "$REPORT is $SIZE bytes — a stub, not splicing"; exit 0
          fi
          cp "$REPORT" "overrides/$DAY.html"
          python3 ipo_review.py "$DAY"
          python3 mirror.py
      # The hand-written pre-session read, spliced the same way and for the same
      # reason. It is written the evening before, so on most mornings the day's
      # report does not exist yet when it is composed and this is the step that
      # finally puts it on the page.
      #
      # Same three guards as the review above: a day with no BY_DAY entry is
      # skipped, a report under 50 KB is a stub and is skipped, and the whole
      # step is best-effort so a failed splice cannot lose a mirror that has
      # already succeeded. It runs AFTER the review's step because both end in
      # `mirror.py` and the last one to run is the one whose output ships; the
      # order between them is otherwise immaterial, since each replaces only
      # its own section.
      - name: splice the hand-written pre-session read
        continue-on-error: true
        run: |
          DAY=$(TZ=Asia/Kolkata date +%F)
          REPORT="stocks/reports/$DAY.html"
          if ! grep -q "\"$DAY\":" premarket.py; then
            echo "no pre-session read for $DAY"; exit 0
          fi
          if [ ! -f "$REPORT" ]; then
            echo "no report at $REPORT yet"; exit 0
          fi
          SIZE=$(wc -c < "$REPORT")
          if [ "$SIZE" -lt 50000 ]; then
            echo "$REPORT is $SIZE bytes — a stub, not splicing"; exit 0
          fi
          cp "$REPORT" "overrides/$DAY.html"
          python3 premarket.py "$DAY"
          python3 mirror.py
      # **After the splice, not before it.** The step above ends with a second
      # `mirror.py`, and for two days nothing restored the hub after that one:
      # the guard had been attached to the first call site rather than to the
      # file, so every run that spliced a review rebuilt index.html and threw
      # the chart away again. 5 October onwards, every mirror commit is 77,656
      # bytes against the hand-maintained 74,474.
      #
      # So this is the last thing that touches the page, and `stamp_hub.py`
      # now refuses to write a hub whose chart carries no geometry — a presence
      # check passed the broken page, because the template declares the same
      # three ids with an empty `d`.
      - name: restore the hub and re-stamp its counters
        run: |
          cp /tmp/index.hand.html index.html
          python3 stamp_hub.py
      - name: commit
        run: |
          git config user.name "trading-book mirror"
          git config user.email "mirror@users.noreply.github.com"
          git add -A reports index.html latest.html stocks crypto analysis extras overrides
          git diff --cached --quiet || git commit -m "mirror $(date -u +%F)"
          git push
      # A green mirror has never meant a published page. On 2 November the
      # workflow succeeded, the Pages build succeeded, and the live URL served
      # the *previous* version of the report for several minutes with a 200 --
      # while three earlier reads of the same URL had returned 404 against a
      # build that had already finished. Status codes lied in both directions
      # inside twenty minutes.
      #
      # So the run does not end until the bytes at the public URL are the bytes
      # it just committed. This step is NOT continue-on-error: a mirror that
      # did not reach the site is a failed mirror, and the only thing worse
      # than an unpublished page is an unpublished page behind a green tick.
      - name: verify the site serves what we just committed
        run: python3 verify_published.py "$(TZ=Asia/Kolkata date +%F)"
