name: mirror the morning book
on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST, after the 18:00 IST build
  workflow_dispatch:
    inputs:
      refresh:
        description: re-fetch every day, not only the missing ones
        type: boolean
        default: false
permissions:
  contents: write
concurrency: mirror
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mirror
        run: python3 mirror.py ${{ inputs.refresh && '--refresh' || '' }}
      - name: commit
        run: |
          git config user.name "trading-book mirror"
          git config user.email "mirror@users.noreply.github.com"
          git add -A reports index.html latest.html
          git diff --cached --quiet || git commit -m "mirror $(date -u +%F)"
          git push
